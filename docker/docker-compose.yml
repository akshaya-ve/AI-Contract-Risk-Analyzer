version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: contract_analyzer_backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=gemini
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=sqlite:///./contract_analyzer.db
      - CHROMA_PERSIST_DIR=./chroma_db
    volumes:
      - chroma_data:/app/chroma_db
      - upload_data:/app/uploads
      - report_data:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: contract_analyzer_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  upload_data:
  report_data:
